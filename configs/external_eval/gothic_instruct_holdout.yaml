# External evaluation sets for Gothic instruction tuning
# These are held-out test sets with loss masking (loss only on response tokens)
external_eval_sets:
  - name: got-translation_holdout
    path: data/gothic_instruct/translation_all-codices_both-scripts_both-directions_test.jsonl
    format: instruction_jsonl
  - name: got-translation-pd_holdout
    path: data/gothic_instruct/translation_all-codices_both-scripts_both-directions_pd_test.jsonl
    format: instruction_jsonl
  - name: got-translation-cot_holdout
    path: data/gothic_instruct/translation-cot_both-scripts_both-directions_test.jsonl
    format: instruction_jsonl
  - name: got-transliteration_holdout
    path: data/gothic_instruct/transliteration_all-codices_both-directions_test.jsonl
    format: instruction_jsonl
  - name: got-transliteration-pd_holdout
    path: data/gothic_instruct/transliteration_all-codices_both-directions_pd_test.jsonl
    format: instruction_jsonl
  - name: got-alignment_holdout
    path: data/gothic_instruct/alignment_both-scripts_test_v0.4.jsonl
    format: instruction_jsonl
  - name: got_holdout
    path: data/gothic_prepared/monolingual_all-codices_both-scripts_test.txt
    format: plaintext
