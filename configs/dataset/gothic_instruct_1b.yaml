type: multinomial
language: gothic_instruct
sources:
  - type: instruction_jsonl
    id: got-translation
    dev_size: -1  # Using external holdout (test split)
    sampling_prob: 0.08 #(0.08 ~= x80)
    path: data/gothic_instruct/translation_all-codices_both-scripts_both-directions_train_v1.1.0.jsonl
  - type: instruction_jsonl
    id: got-translation-cot
    dev_size: -1  # Using external holdout (test split)
    sampling_prob: 0.05 #(0.05 ~= x45)
    path: data/gothic_instruct/translation-cot_both-scripts_both-directions_train_v2.2.0.jsonl
  - type: instruction_jsonl
    id: got-transliteration
    dev_size: -1  # Using external holdout (test split)
    sampling_prob: 0.08 #(0.08 ~= x64)
    path: data/gothic_instruct/transliteration_all-codices_both-directions_train_v1.1.0.jsonl
  - type: instruction_jsonl
    id: got-alignment
    dev_size: -1
    sampling_prob: 0.15 #(0.15 ~= x24)
    path: data/gothic_instruct/alignment_both-scripts_train_v2.1.0.jsonl
  - type: instruction_jsonl
    id: got-lexicon
    dev_size: -1
    sampling_prob: 0.05 #(0.05 ~= x21)
    path: data/gothic_instruct/dictionary-lookup_both-scripts_both-directions_train_v1.0.0.jsonl
  - type: instruction_hf
    id: eng-chat
    name: HuggingFaceH4/no_robots
    split: train
    dev_size: -1
    sampling_prob: 0.05 #(0.05 ~= x32)
    # Collapse newline runs (plus surrounding whitespace) into a single space so
    # the chat data matches the single-line formatting of the Gothic tasks.
    substitutions:
      - pattern: '\s*\n+\s*'
        replacement: ' '
  - type: instruction_jsonl
    id: eng-dolly-grounded
    dev_size: -1
    sampling_prob: 0.025 #(0.025 ~= x32)
    path: data/english_instruct/dolly-grounded_closed-qa-extract-summ_train.jsonl
  - type: instruction_jsonl
    id: eng-squad
    dev_size: -1
    sampling_prob: 0.1 #(0.1 ~= x4)
    path: data/english_instruct/squad-v2_extractive-qa_train.jsonl
  - type: huggingface
    id: eng
    name: allenai/c4
    config: en
    split: train
    max_samples: 5020000
    min_words_per_line: 8
    oversampling_factor: 8
    dev_size: 20000
alpha: 0.5
total_samples: 9000000
dev_size: 0.1
cache_dir: "data/${dataset.language}"
