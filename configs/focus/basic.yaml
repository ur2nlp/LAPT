enabled: true
tokenizer_path: null  # if provided, load existing tokenizer; if null, train new one
vocab_size: 32768
num_samples: 1000000  # number of samples for tokenizer training & FOCUS
inherit_additional_special_tokens: true  # Whether to inherit additional tokens like <madeupword0-6> from base model
character_coverage: 1.0  # SentencePiece character coverage (0-1): covers characters making up this fraction of corpus. Use 1.0 for small character sets, 0.9995 for rich sets (CJK)
tokenizer_algorithm: null  # Fresh-tokenizer algorithm: null inherits the base tokenizer's (BPE/Unigram); set 'unigram' or 'bpe' to override
fasttext_model_min_count: 1  # Minimum occurrences for FastText embeddings (lower for low-resource scenarios)
use_seed_vocabulary: false  # Whether to bias tokenizer training toward base vocabulary overlap using seed vocabulary
# FOCUS embedding reuse policy. Embeddings are cached per (mix + num_samples +
# seed + fasttext_model_min_count) hash under <tokenizer_dir>/focus_embs/.
#   null  (default): strict — only load a sidecar whose hash matches this run.
#                    Recompute on any mismatch.
#   "any"          : load the sole cached set (across both focus_embs/ and the
#                    legacy unhashed files at the tokenizer root). Errors if
#                    more than one set exists.
#   "<hash>"       : load that specific sidecar; error if absent.
reuse_embeddings: null
