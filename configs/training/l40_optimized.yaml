name: l40_optimized

max_length: 512

num_train_epochs: 1.0
max_steps: 100000
train_batch_size: 50
gradient_accumulation_steps: 1
gradient_checkpointing: false
learning_rate: 1e-5
lr_scheduler_type: linear
warmup_ratio: 0.005
max_grad_norm: 1.0

# Performance optimizations
bf16: true
optim: "adamw_torch_fused"  # 10-15% faster than default AdamW
dataloader_num_workers: 4  # Parallel data loading (adjust based on CPU cores)
torch_compile: false  # 10-30% speedup, but adds compilation time on first run

# Regularization
dropout: 0.1
attention_dropout: 0.1
activation_dropout: 0.0
weight_decay: 0.01

# Loss formulation
# "token_mean" (default): HuggingFace default — mean CE over all non-masked tokens
#   in the batch. Long examples dominate the gradient.
# "per_example": mean over examples of (sum of response token CE) / max(t_i, k),
#   where t_i is the example's non-masked label count and k is per_example_loss_floor.
#   Evens out heterogeneous response lengths. Eval loss stays at token_mean so BPC
#   remains comparable across runs.
loss_type: token_mean
per_example_loss_floor: 1  # k; used only when loss_type=per_example

logging_steps: ${divide:${training.max_steps},400}
eval_strategy: steps
metric_for_best_model: loss
eval_steps: ${divide:${training.max_steps},100}
eval_batch_size: 50
compute_ttr: false  # Compute type-token ratio (TTR) diversity metric during evaluation
save_steps: ${divide:${training.max_steps},100}
save_total_limit: 2
early_stopping_patience: 10
early_stopping_delay_ratio: 0.0  # Don't allow early stopping until X% of training complete

# Freezing parameters (optional)
freeze_main_model: false  # Set to true to freeze transformer layers initially
model_freeze_prefix: "model.layer"  # Prefix for parameters to freeze (XGLM transformer layers)
unfreeze_step_ratio: 0.05  # Ratio of max_steps at which to unfreeze (e.g., 0.1 = unfreeze after 10%)

# Gradient correction for vocabulary-pruned continued training (non-standard).
# When true AND z_estimate.json exists alongside the tokenizer, installs hooks
# on lm_head that rescale logit gradients by Z_S/Z to undo pruning distortion.
# See src/gradient_correction.py.
correct_pruned_gradients: false
