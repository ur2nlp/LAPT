[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lapt"
version = "0.1.0"
description = "Language-Adaptive Pre-Training: adapting multilingual LMs to new languages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "C.M. Downey", email = "cmdowney.nlp@gmail.com" }]

# Mirrors environment.yml, which remains the canonical setup path for the
# cluster (conda supplies the CUDA-linked torch build). This list exists so CI
# and contributors can `pip install -e .` without conda. Pin minor versions only
# where reproducibility depends on it.
dependencies = [
    "accelerate>=0.26",
    "datasets>=3,<4",
    "hydra-core>=1,<2",
    "numpy<2.0",
    "pandas",
    "plotnine",
    "protobuf",
    "pyyaml",
    "sacrebleu>=2,<3",
    "sentencepiece>=0.1",
    "tokenizers>=0.15",
    "torch>=2.6",
    "tqdm",
    "transformers>=4.57,<4.58",
]

[project.optional-dependencies]
dev = [
    "mkdocs-material>=9",
    "mkdocstrings[python]>=1",
    "mutmut>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16",
]

[project.urls]
Repository = "https://github.com/ur2nlp/LAPT"

# The framework is a real, installable package. Project branches that add their
# own package re-declare this table to include it alongside `lapt`.
[tool.setuptools.packages.find]
include = ["lapt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `.` makes `lapt` and `tools` importable from a bare checkout, so the suite
# runs without an editable install. This replaces a sys.path.insert in
# tests/conftest.py, and applies before collection rather than during it.
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
# Branch coverage is on because line coverage systematically overstates: it
# cannot see a guard clause whose false path is never taken, which is exactly
# where untested defects concentrate.
branch = true
# `tools/` is deliberately excluded. It is one-off analysis and plotting
# scripts, not library code; including it drags the aggregate to ~24% and
# buries the signal from the code that is actually depended on.
# Project branches that add a package re-declare this table.
source = ["lapt"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "outputs", "models", "tokenizers", "plots"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
]
# Grandfathered pre-existing debt. Each entry is a burn-down target, not a
# permanent exemption. New code is held to everything else.
ignore = [
    "E501",  # line-too-long: pending a `ruff format` adoption pass
    "E402",  # module-import-not-at-top: sys.path setup precedes imports
    "E741",  # ambiguous-variable-name
    "E731",  # lambda-assignment
    "B905",  # zip-without-explicit-strict
    "B904",  # raise-without-from-inside-except
    "UP035", # deprecated-import
]

[tool.ruff.lint.isort]
# Classify explicitly rather than letting ruff infer first-party packages from
# directories on disk. The repo has a gitignored local `tokenizers/` output
# directory, so inference called `tokenizers` first-party on a developer machine
# and third-party in CI (where it is never checked out) -- the same file sorted
# two different ways, and `ruff check` disagreed with itself between a working
# tree and a clean checkout. Naming both sides makes the result reproducible.
known-first-party = [
    "lapt",
    "tools",
]
known-third-party = ["tokenizers"]

[tool.ruff.lint.per-file-ignores]
# Tests re-import module-level names inside test bodies to document what is
# under test, and bind fixtures that are used only for their side effects.
"tests/*" = ["F811", "F841", "B017"]

# Mutation testing: rather than asking which lines the tests *execute* (coverage),
# ask which defects they would *catch*. mutmut copies the tree into `mutants/`,
# introduces one small change at a time (flip a comparison, drop a call, alter a
# literal), and reports whether some test fails. A surviving mutant is a defect
# the suite would ship. This is an audit run on demand, not part of CI.
[tool.mutmut]
# Mutate the framework modules, but scope each run with `only_mutate` -- a whole
# -tree run is far more mutants than a single sitting warrants.
source_paths = ["lapt"]
only_mutate = ["lapt/dataset_utils.py"]
# Deliberately left off. It would skip mutants on lines no test executes, but it
# buys that by running a whole extra in-process pytest pass to collect coverage
# -- and a second pytest run in one process re-imports torch, which dies with
# "function '_has_torch_function' already has a docstring". Coverage already
# tells us which lines are unreached, so the saving is not worth the breakage.
# mutate_only_covered_lines = true
