# Provenance + version registry for Gothic instruction-tuning data.
#
# Reliable versioning starts with this manifest (snapshot 2026-06-05). The
# sha256 is the ground-truth identity of an artifact; filenames may later be
# renamed into a versioned scheme (`..._vMAJOR.MINOR.PATCH.jsonl`) without
# changing the sha. See CHANGELOG.md for the narrative.
#
# `aliases` lists prior filenames (referenced in finished configs / the registry)
# that resolve to the same content as the entry they sit on -- the bridge from an
# old config path string to its current versioned file.
#
# `used_by` lists the finished training runs whose configs reference the file.
# CAVEAT: a run consumed whatever bytes sat at that path *at run time*. Where a
# file was regenerated this session (cot, dictionary, alignment; newline ->
# space), the runs consumed the ARCHIVED newline-form, and the live 1.0.0 is the
# content-identical space-normalization of it (verified: flatten(old)==new).
#
# Bump semantics (settled 2026-06-11), keyed on what changes for a model trained
# on the artifact:
#   MAJOR -- the underlying facts change. New/edited/removed source content: a
#     re-reviewed alignment round (e.g. ws v0.5), a new codex, added pair types,
#     or switching the source file. The model now learns from different information.
#   MINOR -- same facts, different rendering. Prompt phrasings, schema/format,
#     sampling/templating procedure, or added/removed projections of the same
#     relation. Source facts (verses, alignments, glossary entries) are untouched;
#     only how they project into examples changes.
#   PATCH -- corrective regeneration, no intended change to content OR rendering.
#     A bugfix bringing output back in line with already-documented behavior,
#     whitespace/separator normalization, dropping a corrupt record, or a
#     manifest-only fix. Test: did we mean to change the output, or fix it to
#     match what it was already supposed to be?
# 1.0.0 was the agreed starting label for every artifact.

schema_version: 1
snapshot_date: 2026-06-05

# Shared format of all 1.0.0 releases: single-line prompt ending in
# " Response:"; response begins with a single leading space; no newlines
# (the PTEx tokenizer has no newline piece -- see .claude/TODO.md).
prompt_schema: "space-delimited; prompt ends ' Response:'; response leading-space; no newlines"

