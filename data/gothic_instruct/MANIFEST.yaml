        generator: {module: gothic.oov_augmentation.augment, args: "script=both, prompt-style=both, max-per-verse=all, min-gloss=1, temperature=0.6, top-p=1.0", seed: 1, note: "trainable filter {verified_correct, kept_edited} via gothic.word_spotting.canonical; regenerated 2026-07-13 at c307b87 code"}
        used_by: []
        notes: >-
          MAJOR bump over 2.0.0, for two compounding reasons. (1) The committed 2.0.0
          bytes were NOT reproducible from the committed generator: both the lapt and
          gothic-data envs deterministically emit 16488 train (vs the file's 16487) with
          entirely different non-words at the same seed — the c307b87 commit bundled the
          generator with an artifact that predates a final generator edit. (2) This
          release also folds in the diacritics-only canonical clean. The net effect is a
          wholesale change to the generated non-words (the substantive content a model
          must flag as OOV), not a cosmetic re-rendering — and registered (uncommitted)
          models were already trained on 2.0.0, so MAJOR is the honest signal that this
          is NOT comparable to what those runs consumed. This 3.0.0 is the new
          reproducible baseline (deterministic under current code). Diverges in version
          from the alignment/cot 2.1.0 diacritic bumps by design: those were provably
          diacritic-only, this is a generator swap. Not yet trained on (by a committed run).

          STALE AS OF 2026-08-30 (noted, not corrected). These bytes are no longer
          reproducible from the committed generator, for a *different* reason than the
          2.0.0 case above. `fe68e01` (2026-07-24) unified the expand_to_cot response
          format — 4 gloss styles / 4 conclusions / 2 join styles collapsed to one each
          — but did not update augment.py, which consumes those templates. That left
          augment.py broken at import (`GLOSS_ITEM_STYLES` gone) until it was repaired
          on 2026-08-30; the repair adopts the unified format. So the current generator
          emits a single canonical response style, while these 3.0.0 bytes still carry
          the retired variety: 8130/16488 train examples (49%) use the retired period /
          "However" join alone. The *non-words* — the substantive OOV content — are
          unaffected; the drift is response rendering only. Deliberately NOT regenerated:
          the task has been out of the active mixture for a while, so a 4.0.0 bump would
          buy nothing. Regenerate (MAJOR, response content changes for ~half the file)
          before any run that actually consumes oov-hedge again.
