        aliases: []
        source: {name: ws-alignments, version: "v0.5", path: "data/gothic_word_spotting/{train,test}_alignments.jsonl", git_sha: cf21d31}
        generator: {module: gothic.oov_augmentation.augment, args: "script=both, prompt-style=both, max-per-verse=all, min-gloss=1, temperature=0.6, top-p=1.0", seed: 1, note: "non-word via gothic.oov_augmentation.stems (T=0.6 knee); trainable filter {verified_correct, kept_edited} via gothic.word_spotting.canonical"}
        used_by: []
        notes: >-
          New artifact, started at 2.0.0 (not 1.0.0) to co-version with the
          v0.5-alignment-derived family (alignment 2.0.0, translation-cot 2.0.0):
          same source facts, no literal 1.0.0 predecessor. got2eng only (hedging
          presupposes an unknown *source* word). One example per trainable word
          (each corrupts a different word); both scripts x both prompt styles ->
          16,487 train / 4,088 test. Non-word carries the replaced word's grafted
          prefix/suffix but a novel stem, so it flags as unknown-but-well-formed
          Gothic, not spelling-gibberish. NOTE: bpc on plain translation is no
          longer cross-regime comparable once this is mixed in (same prompt now
          branches to a hedge); judge by clean-holdout over-hedge rate + the
          saijands OOV probe, not a non-word holdout (gameable by spelling cues).
          Not yet trained on. See .claude/gothic/oov_robustness_augmentation.md.
