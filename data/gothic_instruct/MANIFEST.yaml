  oov-hedge-instruct:
    description: >-
      OOV-robustness hedging: a verified-correct aligned Gothic word is replaced
      with a generated non-word, and the got->eng target flags it as unrecognized
      and blanks its English span while translating the rest. CoT-fallback response
      (glosses the verse's other trainable words), emitted under both the plain
      translation prompt and the CoT prompt. Morphology-silent (whole-word hedge).
    current: 3.0.0
    releases:
      - version: 3.0.0
        files:
          train: {path: oov-hedge_both-scripts_got2eng_train_v3.0.0.jsonl, sha256: 582d8e64c1233c0149669001cfb23381d4ccb94d5dea886bf994e643d1906cfd, n: 16488}
          test:  {path: oov-hedge_both-scripts_got2eng_test_v3.0.0.jsonl,  sha256: 197cee1162ea784e2ffbe368b1db99f98f782aa3a7cc3d23b4437a8298284cde, n: 4088}
