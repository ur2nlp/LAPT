# Provenance + version registry for Gothic instruction-tuning data.
#
# Reliable versioning starts with this manifest (snapshot 2026-06-05). The
# sha256 is the ground-truth identity of an artifact; filenames may later be
# renamed into a versioned scheme (`..._vMAJOR.MINOR.PATCH.jsonl`) without
# changing the sha. See CHANGELOG.md for the narrative.
#
# `used_by` lists the finished training runs whose configs reference the file.
# CAVEAT: a run consumed whatever bytes sat at that path *at run time*. Where a
# file was regenerated this session (cot, dictionary, alignment; newline ->
# space), the runs consumed the ARCHIVED newline-form, and the live 1.0.0 is the
# content-identical space-normalization of it (verified: flatten(old)==new).
#
# Bump semantics (MAJOR/MINOR/PATCH) are intentionally NOT yet defined; to be
# settled in a dedicated discussion. 1.0.0 is just the agreed starting label.

schema_version: 1
snapshot_date: 2026-06-05

# Shared format of all 1.0.0 releases: single-line prompt ending in
# " Response:"; response begins with a single leading space; no newlines
# (the PTEx tokenizer has no newline piece -- see .claude/TODO.md).
prompt_schema: "space-delimited; prompt ends ' Response:'; response leading-space; no newlines"

