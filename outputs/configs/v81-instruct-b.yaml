seed: 1
hf_model: models/old_germanic/xglm564m_focus-v32k-s5m_seeded-5.0x-lambda0.99_l40-optimized_v81/best-checkpoint
dataset:
  type: multinomial
  language: gothic_instruct
  cache_dir: data/gothic_instruct
  sources:
  - type: instruction_jsonl
    id: got-translation
    dev_size: -1
    path: data/gothic_instruct/translation_all-codices_both-scripts_both-directions_train.jsonl
  - type: instruction_jsonl
    id: got-transliteration
    dev_size: -1
    path: data/gothic_instruct/transliteration_all-codices_both-directions_train.jsonl
  - type: instruction_jsonl
    id: eng-flan
    path: data/flan_filtered/flan_nli_qa.jsonl
  - type: plaintext
    id: got
    dev_size: -1
    path: data/gothic_prepared/monolingual_all-codices_both-scripts_train.txt
  - type: huggingface
    id: eng
    name: wikimedia/wikipedia
    config: 20231101.en
    split: train
    max_samples: 5100000
    min_words_per_line: 8
    oversampling_factor: 32
    dev_size: 100000
  alpha: 0.5
  total_samples: 9000000
output_dir: models
model_name: null
init_model_id: v81
resume_from_checkpoint: null
training:
  name: l40_optimized
  max_length: 512
  num_train_epochs: 1.0
  max_steps: 100000
  train_batch_size: 18
  gradient_accumulation_steps: 10
  gradient_checkpointing: false
  learning_rate: 1.0e-05
  lr_scheduler_type: linear
  warmup_ratio: 0.005
  max_grad_norm: 1.0
  bf16: true
  optim: adamw_torch_fused
  dataloader_num_workers: 4
  torch_compile: false
  dropout: 0.2
  attention_dropout: 0.2
  activation_dropout: 0.0
  weight_decay: 0.01
  logging_steps: 250
  eval_strategy: steps
  metric_for_best_model: got-translation_holdout_loss
  eval_steps: 1000
  eval_batch_size: 36
  dev_size: 0.1
  compute_ttr: true
  save_steps: 1000
  save_total_limit: 2
  early_stopping_patience: null
  early_stopping_delay_ratio: 0.0
  freeze_main_model: false
  model_freeze_prefix: model.layer
  unfreeze_step_ratio: 0.05
focus:
  enabled: false
external_eval:
  external_eval_sets:
  - name: got-translation_holdout
    path: data/gothic_instruct/translation_all-codices_both-scripts_both-directions_test.jsonl
    format: instruction_jsonl
  - name: got-transliteration_holdout
    path: data/gothic_instruct/transliteration_all-codices_both-directions_test.jsonl
    format: instruction_jsonl
experiment_id: v81-instruct-b
