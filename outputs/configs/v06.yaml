seed: 1
hf_model: facebook/xglm-564M
dataset:
  type: multinomial
  language: old_germanic
  cache_dir: data/old_germanic
  sources:
  - type: plaintext
    language: ang
    path: data/beowulf/beowulf_clean.txt
  - type: plaintext
    language: got
    path: data/gotica/gotica_clean.txt
  - type: concat
    language: non
    sources:
    - type: plaintext
      path: data/sagas/sagas_clean.txt
    - type: plaintext
      path: data/icecorpus-texts/icepahc_12th-18th_clean.txt
  - type: plaintext
    language: got-eng
    path: data/parallel/gothic_english.txt
  - type: plaintext
    language: eng
    path: data/flan_filtered/flan_nli_qa_short.txt
  alpha: 0.7
  total_samples: 200000
output_dir: models
model_name: null
resume_from_checkpoint: null
training:
  name: l40_basic
  max_length: 512
  num_train_epochs: 1.0
  max_steps: 100000
  train_batch_size: 12
  gradient_accumulation_steps: 10
  gradient_checkpointing: false
  learning_rate: 1.0e-05
  lr_scheduler_type: linear
  warmup_ratio: 0.005
  max_grad_norm: 1.0
  dropout: 0.15
  attention_dropout: 0.15
  activation_dropout: 0.0
  logging_steps: ${divide:${training.max_steps},400}
  eval_strategy: steps
  metric_for_best_model: got-eng_loss
  eval_steps: ${divide:${training.max_steps},100}
  eval_batch_size: 20
  dev_size: 0.1
  compute_ttr: true
  save_steps: ${divide:${training.max_steps},100}
  save_total_limit: 2
  early_stopping_patience: 10
  early_stopping_delay_ratio: 0.2
  freeze_main_model: true
  model_freeze_prefix: model.layer
  unfreeze_step_ratio: 0.2
focus:
  dataset:
    type: multinomial
    language: old_germanic
    sources:
    - type: plaintext
      language: ang
      path: data/beowulf/beowulf_clean.txt
    - type: plaintext
      language: got
      path: data/gotica/gotica_clean.txt
    - type: concat
      language: non
      sources:
      - type: plaintext
        path: data/sagas/sagas_clean.txt
      - type: plaintext
        path: data/icecorpus-texts/icepahc_12th-18th_clean.txt
    - type: plaintext
      language: got-eng
      path: data/parallel/gothic_english.txt
    - type: huggingface
      language: eng
      name: wikitext
      config: wikitext-103-v1
      split: train
      text_column: text
      max_samples: 100000
    alpha: 0.7
    total_samples: 200000
    cache_dir: data/old_germanic_no_flan
  enabled: true
  tokenizer_path: null
  vocab_size: 16384
  num_samples: 200000
  inherit_additional_special_tokens: true
  character_coverage: 0.999
  fasttext_model_min_count: 1
  use_seed_vocabulary: false
experiment_id: v06
fresh_dataset: true
